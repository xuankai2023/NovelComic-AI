[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelcomic-publisher"
version = "0.1.0"
description = "NovelComic publishing API"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "aio-pika>=9.4,<10",
  "alibabacloud-imageseg20191230>=3.0,<4",
  "alibabacloud-tea-openapi>=0.3,<1",
  "alibabacloud-tea-util>=0.3,<1",
  "clerk-backend-api>=2.1,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "motor>=3.6,<4",
  "pyjwt[crypto]>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "cos-python-sdk-v5>=1.9,<2",
  "redis>=5.2,<7",
  "svix>=1.40,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
