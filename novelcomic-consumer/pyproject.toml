[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelcomic-consumer"
version = "0.1.0"
description = "NovelComic background consumer"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "aio-pika>=9.4,<10",
  "fastapi>=0.115,<1",
  "motor>=3.6,<4",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
