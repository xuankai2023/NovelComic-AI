[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelcomic-agent"
version = "0.1.0"
description = "FastAPI agent service with comic production control-plane contracts."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aio-pika>=9.4,<10",
  "alibabacloud_imageseg20191230>=3.0.0,<4",
  "alibabacloud_tea_openapi>=0.3,<1",
  "alibabacloud_tea_util>=0.3,<1",
  "asyncpg>=0.30,<1",
  "cos-python-sdk-v5>=1.9.30,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<12",
  "pydantic-settings>=2.6,<3",
  "pyjwt[crypto]>=2.8,<3",
  "pymongo>=4.9,<5",
  "redis>=5.2,<6",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
postgres = [
  "asyncpg>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/novelcomic_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
